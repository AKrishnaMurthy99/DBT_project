version: 2

models:
  - name: fct_orders
    description: >
      One row per order. Joined to the customer version
      valid at the time of the order.

    columns:
      - name: order_id
        description: Source-system order identifier.
        data_tests:
          - unique
          - not_null

      - name: order_date
        description: Date on which the order was placed.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day

      - name: truck_key
        description: Surrogate key identifying the truck.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_truck')
              field: truck_key

      - name: customer_key
        description: Customer version valid when the order was placed.
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key

      - name: order_total
        description: Final amount paid after tax and discounts.

  - name: fct_order_items
    description: >
      One row per order line with cost, profit and margin.

    columns:
      - name: order_detail_id
        description: Unique identifier for each order line.
        data_tests:
          - unique
          - not_null

      - name: menu_item_key
        description: Surrogate key identifying the menu item.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_menu')
              field: menu_item_key

      - name: margin_pct
        description: Gross margin percentage. Null when revenue is zero.